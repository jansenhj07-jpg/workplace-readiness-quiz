<!DOCTYPE html><html><head><meta charset="utf-8"><title>Workplace Readiness Mini Quiz</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:40px auto;padding:20px}.btn{display:block;width:100%;text-align:left;padding:10px;margin:8px 0}.hidden{display:none}</style></head><body><h2>Workplace Readiness Mini Quiz</h2><p>Choose what you would do in each situation. Immediate feedback helps you learn.</p><div id="q"></div><div id="feedback"></div><button id="nextBtn" class="hidden">Next Question</button><div id="result"></div><script>(function(){const qs=[{q:'You are assigned a task but do not understand part of the instructions. What is the best first step?',a:['Stay quiet and guess','Ask clarifying questions early','Wait until the deadline'],c:1,f:'Strong choice. Asking questions early prevents mistakes and shows engagement.'},{q:'A meeting starts at 10:00 AM. When should you join?',a:['10:05 AM','Exactly at 10:00 if possible','Whenever you finish other work'],c:1,f:'Being on time signals reliability and respect for others' schedules.'}];let i=0,score=0;const qDiv=document.getElementById('q');const fb=document.getElementById('feedback');const next=document.getElementById('nextBtn');const result=document.getElementById('result');function render(){fb.innerHTML='';next.classList.add('hidden');const item=qs[i];qDiv.innerHTML='<div><b>Question '+(i+1)+' of '+qs.length+'</b></div><p>'+item.q+'</p>'+item.a.map((x,idx)=>'<button class="btn" data-i="'+idx+'">'+x+'</button>').join('');qDiv.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const choice=Number(b.dataset.i);fb.textContent=(choice===item.c?'✓ ':'Learning point: ')+item.f;if(choice===item.c)score++;qDiv.querySelectorAll('button').forEach(x=>x.disabled=true);next.classList.remove('hidden');}));}next.addEventListener('click',()=>{i++;if(i>=qs.length){qDiv.innerHTML='';fb.innerHTML='';next.classList.add('hidden');result.textContent='Final score: '+score+' / '+qs.length;}else render();});render();})();</script></body></html>
